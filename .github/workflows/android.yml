
name: Build PDF Master APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PDF_Master_Android_Project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract Android Project
        run: |
          mkdir extracted
          unzip -o PDF_Master_Android_Project.zip -d extracted
          find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)")
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Master-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          
